<!-- SolNav route UI (minimal): injected by route_server.py before </html> -->
<style>
  #sn {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 316px;
    z-index: 1000;
    color: #eee;
    font: 13px/1.35 system-ui, -apple-system, sans-serif
  }

  #sn * {
    box-sizing: border-box
  }

  .sn-glass {
    background: rgba(24, 24, 28, .86);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .45)
  }

  #sn-top {
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    align-items: center
  }

  #sn-fields {
    flex: 1;
    position: relative;
    padding-left: 16px
  }

  #sn-fields:before {
    content: "";
    position: absolute;
    left: 4px;
    top: 17px;
    bottom: 17px;
    border-left: 2px dotted #666
  }

  #sn-fields i {
    position: absolute;
    left: 0;
    width: 10px;
    height: 10px;
    border-radius: 50%
  }

  .sn-in {
    display: flex;
    align-items: center;
    gap: 4px;
    position: relative
  }

  .sn-in input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    border-bottom: 1px solid rgba(255, 255, 255, .08);
    color: #fff;
    padding: 9px 2px;
    font-size: 13.5px;
    outline: none
  }

  .sn-in input:focus {
    border-bottom-color: #a259ff
  }

  .sn-in input::placeholder {
    color: #8b8b93
  }

  .sn-ic {
    background: none;
    border: 0;
    color: #a9a9b3;
    cursor: pointer;
    font-size: 15px;
    padding: 4px 6px;
    border-radius: 8px;
    transition: .15s
  }

  .sn-ic:hover {
    background: rgba(255, 255, 255, .1);
    color: #fff
  }

  .sn-ic.on {
    color: #a259ff;
    background: rgba(162, 89, 255, .18)
  }

  #sn-swap {
    align-self: center
  }

  #sn-sug {
    margin: 0 8px 8px;
    border-radius: 10px;
    overflow: hidden;
    background: rgba(255, 255, 255, .06)
  }

  #sn-sug div {
    padding: 8px 10px;
    font-size: 12.5px;
    color: #ddd;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis
  }

  #sn-sug div:hover {
    background: rgba(162, 89, 255, .25)
  }

  #sn-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px 10px;
    color: #9a9aa5;
    font-size: 12px
  }

  #sn-bar input {
    background: rgba(255, 255, 255, .08);
    border: 0;
    border-radius: 8px;
    color: #fff;
    padding: 4px 6px;
    font-size: 12px;
    color-scheme: dark
  }

  #sn-msg {
    flex: 1;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap
  }

  #sn-msg.err {
    color: #ff8a80
  }

  #sn-cards {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px
  }

  .sn-card {
    padding: 11px 13px;
    border-radius: 14px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: .18s;
    animation: snin .3s both
  }

  .sn-card:hover {
    background: rgba(40, 40, 48, .92)
  }

  .sn-card.sel {
    border-color: #a259ff;
    background: rgba(56, 32, 90, .85)
  }

  .sn-h {
    display: flex;
    align-items: baseline;
    gap: 8px
  }

  .sn-h b {
    font-weight: 600;
    font-size: 14px;
    flex: 1
  }

  .sn-h .t {
    font-size: 20px;
    font-weight: 600
  }

  .sn-h .t small {
    font-size: 11px;
    font-weight: 400;
    color: #a9a9b3;
    margin-left: 2px
  }

  .sn-sub {
    color: #a9a9b3;
    font-size: 12px;
    margin-top: 2px
  }

  .sn-best {
    font-size: 10px;
    color: #c9a5ff;
    border: 1px solid #a259ff;
    border-radius: 99px;
    padding: 0 6px;
    margin-left: 6px;
    font-weight: 400
  }

  .sn-more {
    max-height: 0;
    overflow: hidden;
    transition: max-height .25s ease
  }

  .sn-card.sel .sn-more {
    max-height: 120px
  }

  .sn-bar {
    height: 4px;
    border-radius: 4px;
    background: #f2b84b55;
    margin: 10px 0 6px;
    overflow: hidden
  }

  .sn-bar span {
    display: block;
    height: 100%;
    background: #4cc38a;
    border-radius: 4px;
    transition: width .5s
  }

  .sn-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 7px
  }

  .sn-chips span {
    background: rgba(255, 255, 255, .09);
    border-radius: 99px;
    padding: 2px 8px;
    font-size: 11px;
    color: #ccc
  }

  #sn-mode {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: none;
    padding: 4px;
    gap: 2px;
    z-index: 1000
  }

  #sn-mode button {
    background: none;
    border: 0;
    color: #bbb;
    padding: 7px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 13px;
    transition: .15s
  }

  #sn-mode button.on {
    background: #a259ff;
    color: #fff
  }

  .sn-spin {
    width: 14px;
    height: 14px;
    border: 2px solid #555;
    border-top-color: #a259ff;
    border-radius: 50%;
    animation: snsp .7s linear infinite;
    display: inline-block;
    vertical-align: -2px;
    margin-right: 6px
  }

  .sn-ico {
    display: inline-flex;
    vertical-align: -3px;
    margin-right: 7px
  }

  #sn-rec {
    padding: 10px 13px;
    border-radius: 14px;
    border-left: 3px solid #a259ff;
    cursor: pointer;
    animation: snin .3s both
  }

  #sn-rec b {
    font-size: 13px
  }

  #sn-rec .sn-sub {
    margin-top: 1px
  }

  #sn-rec:hover {
    background: rgba(40, 40, 48, .92)
  }

  .sn-recpill {
    background: #a259ff;
    color: #fff;
    border-color: #a259ff
  }

  @keyframes snsp {
    to {
      transform: rotate(360deg)
    }
  }

  @keyframes snin {
    from {
      opacity: 0;
      transform: translateY(6px)
    }
  }
</style>
<div id="sn">
  <div class="sn-glass">
    <div id="sn-top">
      <div id="sn-fields">
        <i style="top:15px;background:#4d9dff"></i><i style="bottom:15px;background:#ff5c5c"></i>
        <div class="sn-in"><input id="sn-o" placeholder="Start" autocomplete="off"><button class="sn-ic" id="sn-o-gps"
            title="Use my location">&#9678;</button><button class="sn-ic" id="sn-o-pick"
            title="Pick on map">&#9678;&#xFE0E;</button></div>
        <div class="sn-in"><input id="sn-d" placeholder="Where to?" autocomplete="off"><button class="sn-ic"
            id="sn-d-pick" title="Pick on map">&#9678;&#xFE0E;</button></div>
      </div>
      <button class="sn-ic" id="sn-swap" title="Swap">&#8645;</button>
    </div>
    <div id="sn-sug" style="display:none"></div>
    <div id="sn-bar"><span>Leave</span><input id="sn-t" type="time" title="Blank = now"><span id="sn-msg"></span></div>
  </div>
  <div id="sn-cards"></div>
</div>
<div id="sn-mode" class="sn-glass"><button id="sn-m-ov" class="on">Overview</button><button id="sn-m-3d">3D</button>
</div>
<script>
  (function () {
    const API = location.protocol === 'file:' ? 'http://localhost:8000' : '';
    const PURPLE = [162, 89, 255], DIM = [190, 170, 230, 120], HOV = [210, 180, 255, 230];
    const NAMES = { fastest: 'Fastest', average: 'Balanced', coolest: 'Coolest' };
    const svg = (inner) => `<svg viewBox="0 0 24 24" width="17" height="17">${inner}</svg>`;
    const ICON = {
      fastest: svg('<path fill="#ff9f1c" d="M13 2 4 14h6l-1 8 9-12h-6z"/>'),
      average: svg('<g stroke="#4cd67b" stroke-width="2" stroke-linecap="round" fill="none"><path d="M12 4v16M6 20h12M4 8h16"/><path d="M4 8 1.5 14a2.5 2.5 0 0 0 5 0zM20 8l-2.5 6a2.5 2.5 0 0 0 5 0z"/></g>'),
      coolest: svg('<g stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" fill="none"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/></g>')
    };
    // Recommendation = lowest "felt time": ETA + SUN_WEIGHT x minutes in direct sun.
    // Raise SUN_WEIGHT to favour shade more, lower it to favour speed.
    const SUN_WEIGHT = 1.5;
    let isNight = false;
    const score = k => routes[k].eta_min + SUN_WEIGHT * routes[k].sun_min;
    function recommend() {
      if (isNight) return 'fastest';
      return Object.keys(routes).reduce((a, b) => score(a) <= score(b) ? a : b);
    }
    function reason(k) {
      if (isNight) return 'No sun at night, so the shortest walk wins';
      const r = routes[k], f = routes.fastest, dt = Math.round(r.eta_min - f.eta_min), ds = f.sun_min - r.sun_min;
      if (k === 'fastest') return 'Shade detours cost more time than the sun they save';
      return (dt > 0 ? '+' + dt + ' min' : 'Same time') + ' vs fastest \u00b7 ' + ds.toFixed(1) + ' min less sun';
    }
    const pts = { o: null, d: null };
    let pick = null, routes = null, sel = 'coolest', hov = null, mode = 'ov', timer = null;
    const $ = id => document.getElementById(id);
    const msg = (t, err) => { const m = $('sn-msg'); m.innerHTML = t; m.className = err ? 'err' : ''; m.title = m.textContent; };

    function draw() {
      const D = window.deck; if (!D || typeof deckInstance === 'undefined') return;
      const P = { depthTest: false }, L = [], path = d => d.coordinates;
      const line = (id, data, color, w) => new D.PathLayer({ id, data, getPath: path, getColor: color, getWidth: w, widthUnits: 'pixels', capRounded: true, jointRounded: true, parameters: P });
      if (routes) {
        const ks = Object.keys(routes);
        L.push(line('sn-alt', ks.filter(k => k !== sel && k !== hov).map(k => routes[k]), DIM, 5));
        if (hov && hov !== sel) L.push(line('sn-hov', [routes[hov]], HOV, 6));
        L.push(line('sn-casing', [routes[sel]], [255, 255, 255, 255], 11));
        L.push(line('sn-sel', [routes[sel]], PURPLE, 7));
      }
      const m = []; if (pts.o) m.push({ p: [pts.o.lon, pts.o.lat], c: [77, 157, 255] }); if (pts.d) m.push({ p: [pts.d.lon, pts.d.lat], c: [255, 92, 92] });
      L.push(new D.ScatterplotLayer({ id: 'sn-pts', data: m, getPosition: d => d.p, getFillColor: d => d.c, getLineColor: [255, 255, 255], stroked: true, lineWidthMinPixels: 3, radiusUnits: 'pixels', getRadius: 9, parameters: P }));
      deckInstance.setProps({ layers: [...deckInstance.props.layers.filter(l => !String(l.id).startsWith('sn-')), ...L] });
    }
    function fly(vs) { const D = window.deck, p = { ...vs, transitionDuration: 1200 }; if (D && D.FlyToInterpolator) p.transitionInterpolator = new D.FlyToInterpolator(); deckInstance.setProps({ initialViewState: p }); }
    function setMode(m) {
      mode = m; $('sn-m-ov').className = m === 'ov' ? 'on' : ''; $('sn-m-3d').className = m === '3d' ? 'on' : '';
      const c = routes[sel].coordinates;
      if (m === 'ov') {
        const xs = c.map(p => p[0]), ys = c.map(p => p[1]);
        const vp = new deck.WebMercatorViewport({ width: innerWidth, height: innerHeight, longitude: 101.7, latitude: 3.15, zoom: 12 });
        const f = vp.fitBounds([[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]], { padding: { left: Math.min(350, innerWidth * .4), right: 50, top: 60, bottom: 90 } });
        fly({ longitude: f.longitude, latitude: f.latitude, zoom: Math.min(f.zoom, 18), pitch: 0, bearing: 0 });
      } else { const mid = c[Math.floor(c.length / 2)]; fly({ longitude: mid[0], latitude: mid[1], zoom: 16.5, pitch: 55, bearing: -20 }); }
    }
    $('sn-m-ov').onclick = () => routes && setMode('ov'); $('sn-m-3d').onclick = () => routes && setMode('3d');

    function setPoint(k, lon, lat, label) {
      pts[k] = { lon, lat }; $(k === 'o' ? 'sn-o' : 'sn-d').value = label; $('sn-sug').style.display = 'none';
      clearPick(); draw(); if (pts.o && pts.d) fetchRoutes();
    }
    function clearPick() { pick = null; document.body.style.cursor = '';['sn-o-pick', 'sn-d-pick'].forEach(i => $(i).classList.remove('on')); }
    function startPick(k) { clearPick(); pick = k; $('sn-' + k + '-pick').classList.add('on'); document.body.style.cursor = 'crosshair'; msg('Click the map'); }
    $('sn-o-pick').onclick = () => startPick('o'); $('sn-d-pick').onclick = () => startPick('d');
    $('sn-o-gps').onclick = () => {
      if (!navigator.geolocation) return msg('No GPS in this browser', true);
      msg('<span class="sn-spin"></span>Locating');
      navigator.geolocation.getCurrentPosition(p => {
        setPoint('o', p.coords.longitude, p.coords.latitude, 'My location');
        if (!pts.d) fly({ longitude: p.coords.longitude, latitude: p.coords.latitude, zoom: 16.5, pitch: 55, bearing: -20 }); msg('');
      },
        e => msg('Location unavailable', true), { enableHighAccuracy: true, timeout: 10000 });
    };
    $('sn-swap').onclick = () => {
      [pts.o, pts.d] = [pts.d, pts.o]; const a = $('sn-o').value; $('sn-o').value = $('sn-d').value; $('sn-d').value = a;
      draw(); if (pts.o && pts.d) fetchRoutes();
    };
    deckInstance.setProps({ onClick: i => { if (pick && i && i.coordinate) setPoint(pick, i.coordinate[0], i.coordinate[1], 'Dropped pin'); } });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { clearPick(); $('sn-sug').style.display = 'none'; msg(''); } });

    async function search(q, k) {
      const s = $('sn-sug');
      try {
        const j = await (await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&bounded=1&viewbox=101.60,3.25,101.80,3.05&q=' + encodeURIComponent(q))).json();
        s.innerHTML = ''; s.style.display = 'block';
        if (!j.length) { s.innerHTML = '<div>No matches in Kuala Lumpur</div>'; return; }
        j.forEach(x => {
          const d = document.createElement('div'); d.textContent = x.display_name; d.title = x.display_name;
          d.onclick = () => setPoint(k, +x.lon, +x.lat, x.display_name.split(',')[0]); s.appendChild(d);
        });
      } catch (e) { msg('Search needs internet', true); }
    }
    [['o', 'sn-o'], ['d', 'sn-d']].forEach(([k, id]) => $(id).addEventListener('input', e => {
      clearTimeout(timer); const q = e.target.value.trim();
      if (q.length < 3) { $('sn-sug').style.display = 'none'; return; }
      timer = setTimeout(() => search(q, k), 600);
    }));

    async function fetchRoutes() {
      $('sn-cards').innerHTML = ''; msg('<span class="sn-spin"></span>Finding routes');
      const t = $('sn-t').value;
      const u = `${API}/api/routes?olon=${pts.o.lon}&olat=${pts.o.lat}&dlon=${pts.d.lon}&dlat=${pts.d.lat}` + (t ? `&t=${t}` : '');
      try {
        const j = await (await fetch(u)).json();
        if (j.error) { routes = null; draw(); $('sn-mode').style.display = 'none'; return msg(j.error, true); }
        routes = j.routes; isNight = !!j.night; sel = recommend(); hov = null;
        msg(j.night ? 'Night: no shade data' : 'Sun ' + j.sun.altitude_deg + '\u00b0');
        cards(); draw(); $('sn-mode').style.display = 'flex'; setMode('ov');
      } catch (e) { msg('Route server not reachable', true); }
    }
    $('sn-t').onchange = () => { if (pts.o && pts.d) fetchRoutes(); };

    function chips(c) {
      c = c || {}; const n = k => c[k] || 0, o = [];
      const oth = n('zebra') + n('marked') + n('uncontrolled') + n('unmarked') + n('informal') + n('crossing');
      const add = (v, w) => v && o.push(v + ' ' + w + (v > 1 && w !== 'stairs' ? 's' : ''));
      add(n('signal'), 'signal'); add(oth, 'crossing'); add(n('footbridge'), 'footbridge'); add(n('steps'), 'stairs');
      return o.map(x => `<span>${x}</span>`).join('') || '<span>No crossings</span>';
    }
    function cards() {
      const box = $('sn-cards'); box.innerHTML = '';
      const best = Object.keys(routes).reduce((a, b) => routes[a].sun_min <= routes[b].sun_min ? a : b);
      const rec = recommend();
      const ban = document.createElement('div'); ban.id = 'sn-rec'; ban.className = 'sn-glass';
      ban.innerHTML = `<b><span style="color:#c9a5ff">\u2605</span> Recommended: <span class="sn-ico" style="margin:0 4px 0 2px">${ICON[rec]}</span>${NAMES[rec]}</b><div class="sn-sub">${reason(rec)}</div>`;
      ban.onclick = () => { sel = rec; cards(); draw(); if (mode === 'ov') setMode('ov'); };
      box.appendChild(ban);
      Object.keys(NAMES).forEach((k, i) => {
        const r = routes[k], d = document.createElement('div');
        d.className = 'sn-card sn-glass' + (k === sel ? ' sel' : ''); d.style.animationDelay = i * 60 + 'ms';
        d.innerHTML = `<div class="sn-h"><b><span class="sn-ico">${ICON[k]}</span>${NAMES[k]}${k === rec ? '<span class="sn-best sn-recpill">recommended</span>' : (k === best ? '<span class="sn-best">least sun</span>' : '')}</b><span class="t">${Math.round(r.eta_min)}<small>min</small></span></div>` +
          `<div class="sn-sub">${(r.distance_m / 1000).toFixed(2)} km &middot; ${r.shade_pct}% shaded</div>` +
          `<div class="sn-more"><div class="sn-bar"><span style="width:${r.shade_pct}%"></span></div>` +
          `<div class="sn-sub">${r.sun_min} min in sun &middot; ${r.delay_s}s waiting</div><div class="sn-chips">${chips(r.crossings)}</div></div>`;
        d.onclick = () => { sel = k; cards(); draw(); if (mode === 'ov') setMode('ov'); };
        d.onmouseenter = () => { hov = k; draw(); }; d.onmouseleave = () => { hov = null; draw(); };
        box.appendChild(d);
      });
    }
  })();
</script>
